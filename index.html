
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Apex Motorsport | Driver Login</title>

    <!-- Bootstrap 5 CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <!-- Branding -->
            <div class="brand-section">
                <div class="brand-icon">A</div>

                <h1>APEX <span>MOTORSPORT</span></h1>

                <p>DRIVER PERFORMANCE PORTAL</p>
            </div>

            <!-- Login Form -->
            <div class="login-section">

                <h2>Welcome Back</h2>

                <p class="login-description">
                    Sign in to access your racing dashboard.
                </p>

                <form id="loginForm">

                    <div class="mb-3">
                        <label for="username" class="form-label">
                            Username
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="username"
                            placeholder="Enter your username"
                            value="admin"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">
                            Password
                        </label>

                        <input
                            type="password"
                            class="form-control"
                            id="password"
                            placeholder="Enter your password"
                            value="racing123"
                            required
                        >
                    </div>

                    <!-- Error or Success Message -->
                    <div id="loginMessage" class="mb-3"></div>

                    <button type="submit" class="btn login-button w-100">
                        SIGN IN
                    </button>

                </form>

                <div class="demo-credentials">
                    <p>DEMO LOGIN CREDENTIALS</p>
                    <span>Demo details are prefilled above.</span>
                </div>

            </div>

            <!-- Footer -->
            <div class="login-footer">
                © 2026 Apex Motorsport Dashboard
            </div>

        </div>

    </div>

    <!-- JavaScript -->
    <script src="js/auth.js"></script>

</body>
</html>
